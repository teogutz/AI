# Generate the Xcode project with:  brew install xcodegen && xcodegen
name: PeakPlan
options:
  bundleIdPrefix: com.example.peakplan   # change to your own reverse-DNS prefix
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""                 # set your Apple Developer Team ID
    CODE_SIGN_STYLE: Automatic

packages:
  PeakPlanKit:
    path: Packages/PeakPlanKit

targets:
  PeakPlan-iOS:
    type: application
    platform: iOS
    sources: [PeakPlan]
    dependencies:
      - package: PeakPlanKit
      # The Watch app is optional: planned workouts reach the Apple Watch's Workout app
      # through WorkoutScheduler on the iPhone. To bundle the PeakPlan Watch app (Start
      # button, notes), uncomment the next line, run xcodegen and make sure Xcode can
      # see your Watch (Window → Devices and Simulators).
      # - target: PeakPlanWatch
    entitlements:
      path: Config/PeakPlan-iOS.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: Config/PeakPlan-iOS-Info.plist
      properties:
        CFBundleDisplayName: PeakPlan
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSHealthShareUsageDescription: PeakPlan reads your completed workouts so your coach (Claude) can review them against the plan.
        NSHealthUpdateUsageDescription: PeakPlan schedules structured workouts on your Apple Watch.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.example.peakplan.refresh]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.peakplan
        TARGETED_DEVICE_FAMILY: "1,2"

  PeakPlan-macOS:
    type: application
    platform: macOS
    sources: [PeakPlan]
    dependencies:
      - package: PeakPlanKit
    entitlements:
      path: Config/PeakPlan-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    info:
      path: Config/PeakPlan-macOS-Info.plist
      properties:
        CFBundleDisplayName: PeakPlan
        LSApplicationCategoryType: public.app-category.healthcare-fitness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.peakplan.mac

  PeakPlanWatch:
    type: application
    platform: watchOS
    sources: [PeakPlanWatch]
    dependencies:
      - package: PeakPlanKit
    info:
      path: Config/PeakPlanWatch-Info.plist
      properties:
        CFBundleDisplayName: PeakPlan
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.example.peakplan
        NSHealthShareUsageDescription: PeakPlan starts your planned workouts in the Workout app.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.peakplan.watchkitapp

schemes:
  PeakPlan-iOS:
    build:
      targets: { PeakPlan-iOS: all }
    run: { config: Debug }
  PeakPlan-macOS:
    build:
      targets: { PeakPlan-macOS: all }
    run: { config: Debug }
  PeakPlanWatch:
    build:
      targets: { PeakPlanWatch: all }
    run: { config: Debug }
